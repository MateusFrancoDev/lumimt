<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lumimt">
  <defs>
    <!-- One star, off to the upper left: the shading of the whole disc
         follows from where it is. No background plate — the icon is
         the planet and nothing else, so it has no square edge. -->
    <radialGradient id="lit" cx="33%" cy="28%" r="84%">
      <stop offset="0" stop-color="#E4EEF4"/>
      <stop offset="0.3" stop-color="#9FC0D4"/>
      <stop offset="0.58" stop-color="#4C789A"/>
      <stop offset="0.82" stop-color="#23425C"/>
      <stop offset="1" stop-color="#132433"/>
    </radialGradient>
  </defs>

  <circle cx="16" cy="16" r="12.4" fill="url(#lit)"/>

  <!-- The limb. It is what keeps the silhouette readable on a light
       browser tab as well as a dark one. -->
  <circle cx="16" cy="16" r="12.4" fill="none" stroke="#B3CFE0" stroke-opacity="0.5" stroke-width="0.9"/>
</svg>
